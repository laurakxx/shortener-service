spring:
  application:
    name: shortener-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/shortener}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080


